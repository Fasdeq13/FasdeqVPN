[package]
name = "fasdeq-native"
version = "1.6.0"
edition = "2021"

[lib]
name = "fasdeq_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
fasdeq-core = { path = "../core" }
serde_json = "1"
jni = "0.21"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
