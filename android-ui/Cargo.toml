[package]
name = "fasdeq-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "fasdeq_ui"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fasdeq-ui-preview"
path = "src/main.rs"

[dependencies]
fasdeq-core = { path = "../core" }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity", "glow"] }
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
