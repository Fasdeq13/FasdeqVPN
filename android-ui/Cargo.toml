[package]
name = "fasdeq-ui"
version = "1.6.0"
edition = "2021"

[lib]
name = "fasdeq_ui"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fasdeq-ui-desktop"
path = "src/desktop_main.rs"

[dependencies]
fasdeq-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[target.'cfg(not(target_os = "android"))'.dependencies]
iced = { version = "0.14", features = ["canvas", "svg", "tokio", "advanced"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
directories = "6"

[target.'cfg(target_os = "android")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["canvas", "tokio", "advanced", "android-native-activity", "glow"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
